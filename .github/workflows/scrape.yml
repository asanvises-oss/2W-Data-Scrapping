name: Scrape Thailand Motorcycle Tire Shops

on:
  workflow_dispatch:
    inputs:
      use_vision:
        description: 'ใช้ Gemini Vision AI ช่วยคัดร้านก้ำกึ่งจากรูปหน้าร้าน (true/false - ต้องตั้งค่า GEMINI_API_KEY ใน Secrets)'
        required: false
        default: 'false'
      max_vision_calls:
        description: 'จำกัดจำนวนร้านสูงสุดที่จะส่งให้ Vision AI ตรวจสอบ'
        required: false
        default: '100'

permissions:
  contents: write

jobs:
  scrape-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Google Maps Scraper (gosom)
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            gosom/google-maps-scraper:latest \
            -input /data/queries.txt \
            -results /data/raw_results.csv \
            -c 2 \
            -depth 10 \
            -lang th \
            -exit-on-inactivity 3m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Filter & Clean Motorcycle Tire Shops
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.use_vision }}" = "true" ]; then
            python filter_shops.py --input raw_results.csv --output clean_motorcycle_tire_shops.csv --use-vision --max-vision ${{ github.event.inputs.max_vision_calls }}
          else
            python filter_shops.py --input raw_results.csv --output clean_motorcycle_tire_shops.csv
          fi

      - name: Commit and push results to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add raw_results.csv clean_motorcycle_tire_shops.csv
          git commit -m "Update motorcycle tire shops dataset ($(date +'%Y-%m-%d'))" || echo "No changes to commit"
          git push
